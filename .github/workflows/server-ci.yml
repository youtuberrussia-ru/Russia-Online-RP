name: Server CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  server:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/russia_online_rp?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
